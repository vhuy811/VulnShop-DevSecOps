name: DevSecOps - nam tang kiem thu

# ==========================================================================
# Repo nay CHUA bo cong cu, khong chua ung dung nao. Nen no tu goi pipeline
# cua chinh minh de quet chinh minh - voi nhung tang co nghia.
#
# Vi sao khong xoa han tep nay di:
#   1. Branch protection dang yeu cau check ten "security / scan". Xoa
#      workflow thi check do khong bao gio duoc bao cao, va moi pull request
#      treo vinh vien o "Expected - waiting for status to be reported".
#   2. Bo cong cu bao mat ma khong tu quet minh thi khong thuyet phuc duoc ai.
#      Ma Python cua tools/ van co the lo secret, va Dockerfile mau van co
#      the sai cau hinh.
#
# project-file de trong va run-dast: false vi khong con ung dung .NET nao
# trong repo. Trang ket qua cua moi lan chay se NOI RO tang doi sanh dong da
# bi bo qua, chu khong im lang de nguoi doc hieu nham thanh "da kiem chung".
# ==========================================================================

on:
  push:
  pull_request:
  workflow_dispatch:
  # Quet dinh ky. Ba kich hoat tren deu bat nguon tu MOT THAY DOI MA NGUON,
  # nen chung mu hoan toan voi mot loai rui ro: ma nguon dung yen nhung the
  # gioi thi khong. Repo khong doi tu thang Mot, den thang Ba co nguoi cong bo
  # CVE cho mot thu vien dang dung - khong commit nao xay ra, khong lan chay
  # nao duoc kich hoat, va khong ai biet.
  schedule:
    - cron: '0 18 * * 1'   # 01:00 thu Ba gio Viet Nam (UTC+7)

# Khai bao quyen o day la BAT BUOC khi goi workflow khac.
#
# Workflow duoc goi khai bao `security-events: write` de day SARIF len Code
# Scanning. Voi mot job thuong, quyen thieu chi bi cat bot luc chay. Nhung voi
# `uses:`, GitHub doi chieu quyen NGAY LUC KHOI DONG: workflow duoc goi xin
# nhieu quyen hon workflow goi no dang co thi ca lan chay that bai truoc khi
# buoc dau tien kip chay - hien ra la "Startup failure", khong co log nao.
permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: ./.github/workflows/devsecops-reusable.yml
    with:
      project-file: ''        # repo nay khong chua ung dung .NET
      run-dast: false         # khong co gi de ban payload vao
      run-image-scan: false   # khong co Dockerfile de dung image
      title: Bo cong cu DevSecOps
      # Bo cong cu la chinh repo nay, nen ghim theo SHA dang chay: nhanh dang
      # thu nghiem se dung tools/ cua chinh nhanh do, khong phai ban tren main.
      toolkit-ref: ${{ github.sha }}
    secrets: inherit
