name: DevSecOps - nam tang kiem thu

# Day la CONG CUONG CHE, khong phai bao cao tham khao. Khac biet nam o buoc
# "Quality gate": neu co canh bao mang nhan CONFIRMED thi job that bai, va
# nhanh khong merge duoc. Mot cong cu chi in ra man hinh thi ai cung co the
# phot lo; mot cong chan thi khong.
#
# Thu tu cac tang duoc xep theo CHI PHI tang dan, de cai re nhat that bai truoc:
#   secret -> thu vien -> ma nguon -> ha tang -> (build + chay app) -> dong
#
# Tang dong la tang dat nhat: phai build, chay ung dung, khoi dong ZAP, roi
# quet tung endpoint. Vi vay no dung cuoi - khong co ly do gi build ca ung dung
# neu Semgrep da bao co SQL injection ngay o buoc truoc.

on:
  push:
  pull_request:
  workflow_dispatch:
  # Quet dinh ky. Ba kich hoat tren deu bat nguon tu MOT THAY DOI MA NGUON,
  # nen chung mu hoan toan voi mot loai rui ro: ma nguon dung yen nhung the
  # gioi thi khong. Repo khong doi tu thang Mot, den thang Ba co nguoi cong bo
  # CVE cho mot thu vien dang dung - khong commit nao xay ra, khong lan chay
  # nao duoc kich hoat, va khong ai biet.
  #
  # Lich nay chinh la buoc nap lai thong tin moi de ung voi ma nguon cu.
  schedule:
    - cron: '0 18 * * 1'   # 01:00 thu Ba gio Viet Nam (UTC+7)

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # can de day SARIF len Code Scanning

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cai .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cai phu thuoc Python
        run: pip install requests

      - name: Tao thu muc bao cao
        run: mkdir -p reports

      # ===============================================================
      # TANG 0 - Secret
      # Re nhat va hau qua nang nhat: mot khoa API lo vao lich su git thi
      # xoa o commit sau khong go duoc no khoi cac commit truoc.
      # ===============================================================
      - name: Gitleaks - quet secret trong ma nguon
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git \
            --report-format=sarif --report-path=/repo/reports/gitleaks.sarif \
            --exit-code 0 --redact

          # Gitleaks KHONG tao tep SARIF khi khong tim thay gi. Doc thang vao
          # tep do lam buoc nay hong ngay ca khi ma nguon sach - lan chay #3
          # cua do an da chet o day o giay thu 41.
          #
          # Xu ly dung: tao mot SARIF rong hop le de buoc day ket qua o cuoi
          # van chay duoc, va NOI RO trong log rang khong co tep khac voi
          # da quet va sach - dung nguyen tac cua chinh do an nay.
          if [ -f reports/gitleaks.sarif ]; then
            N=$(python -c "import json;print(sum(len(r.get('results',[])) for r in json.load(open('reports/gitleaks.sarif')).get('runs',[])))")
            echo "Gitleaks: $N phat hien."
          else
            N=0
            printf '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' \
              > reports/gitleaks.sarif
            echo "Gitleaks khong sinh bao cao. Coi nhu 0 phat hien de pipeline di tiep,"
            echo "nhung day la 'khong co ket qua' chu chua phai bang chung ma nguon sach."
          fi
          echo "GITLEAKS_COUNT=$N" >> $GITHUB_ENV

      # ===============================================================
      # TANG 1 - Thu vien (SCA): CVE trong goi NuGet
      # Tang nay khong suy doan: no so phien ban voi CSDL lo hong da cong bo.
      # ===============================================================
      - name: SCA - doi chieu thu vien voi CSDL lo hong
        run: |
          dotnet restore
          python tools/sca.py --repo . --out reports/sca.json || true
          if [ -f reports/sca.json ]; then
            python - <<'PY'
          import json
          s = json.load(open("reports/sca.json"))["summary"]
          print(f"SCA: {s['packages']} goi dinh lo hong, {s['advisories']} advisory")
          print(f"     Critical {s['by_severity']['Critical']}, High {s['by_severity']['High']}")
          PY
          fi

      # ===============================================================
      # TANG 2 - Ma nguon (SAST): CWE trong ma minh viet
      # Hai lan quet vi hai muc dich nguoc nhau: mot tim dau hieu nguy hiem,
      # mot tim bang chung an toan. Ca hai deu la dau vao cua buoc doi sanh.
      # ===============================================================
      - name: Semgrep - bo rule phat hien
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config semgrep-rules/sast-detect.yaml --exclude semgrep-rules \
            --sarif --output reports/semgrep.sarif --metrics=off

      - name: Semgrep - bo rule kiem sanitizer
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config semgrep-rules/sanitizer-check.yaml --exclude semgrep-rules \
            --sarif --output reports/sanitizers.sarif --metrics=off

      # ===============================================================
      # TANG 3 - Ha tang: cau hinh trien khai + SBOM
      # Ba tang tren chi doc ma nguon ung dung. Tang nay doc thu ma chung mu:
      # Dockerfile va cac goi he dieu hanh di kem image.
      # ===============================================================
      # Goi thang image Trivy thay vi dung action co san. Hai ly do:
      #   1. Action phai ghim so phien ban, va mot tag sai lam hong ca job vi
      #      mot ly do khong lien quan gi toi an ninh.
      #   2. Cach nay GIONG HET tools/trivy.py chay tren may lap trinh vien,
      #      nen ket qua cuc bo va ket qua CI so sanh duoc voi nhau.
      - name: Trivy - quet cau hinh trien khai
        run: |
          docker run --rm -v "$PWD:/target:ro" -v "$PWD/reports:/out" \
            aquasec/trivy:latest config /target \
            --format sarif --output /out/trivy-config.sarif \
            --exit-code 0 --quiet
          echo "Loi cau hinh: $(python -c "import json;print(sum(len(r.get('results',[])) for r in json.load(open('reports/trivy-config.sarif')).get('runs',[])))" 2>/dev/null || echo '?')"

      - name: Trivy - sinh SBOM (CycloneDX)
        run: |
          docker run --rm -v "$PWD:/target:ro" -v "$PWD/reports:/out" \
            aquasec/trivy:latest fs /target \
            --format cyclonedx --output /out/sbom.cdx.json --quiet
          echo "SBOM: $(python -c "import json;print(len(json.load(open('reports/sbom.cdx.json')).get('components',[])))" 2>/dev/null || echo '?') thanh phan"

      # Quet image ton them vai phut nen chi chay o nhanh chinh, khi bam tay, va
      # o lan quet dinh ky - khong chay o moi pull request. Danh doi thoi gian
      # CI la mot quyet dinh thiet ke that cua DevSecOps, khong phai cat xen cho
      # tien: cong chan lam lap trinh vien cho lau se bi tim cach vong qua.
      - name: Trivy - quet container image
        if: >-
          github.ref == 'refs/heads/main' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        run: |
          docker build -f Dockerfile.hardened -t vulnshop:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image vulnshop:ci --scanners vuln \
            --severity CRITICAL,HIGH --quiet || true

      # ===============================================================
      # TANG 4 - Doi sanh tinh x dong
      # ===============================================================
      - name: Sinh lai ban do route
        run: python tools/gen_routes_map.py --root . --base-url http://localhost:5000

      - name: Build
        run: dotnet build VulnShop.csproj -c Release

      - name: Chay ung dung o nen
        run: |
          nohup dotnet run --project VulnShop.csproj --urls http://0.0.0.0:5000 \
            > app.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5000/Product/List > /dev/null; then
              echo "Ung dung da san sang sau ${i} lan thu."
              exit 0
            fi
            sleep 2
          done
          echo "Ung dung khong khoi dong duoc:"; cat app.log; exit 1

      # Tren runner Linux dung --network host, nen ZAP goi thang localhost.
      # Khac voi may Windows phai dung host.docker.internal.
      - name: Khoi dong OWASP ZAP dang daemon
        run: |
          docker run -d --name zap --network host zaproxy/zap-stable \
            zap.sh -daemon -host 0.0.0.0 -port 8090 \
            -config api.addrs.addr.name=.* \
            -config api.addrs.addr.regex=true \
            -config api.disablekey=true
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8090/JSON/core/view/version/ > /dev/null; then
              echo "ZAP da san sang sau ${i} lan thu."
              exit 0
            fi
            sleep 2
          done
          echo "ZAP khong khoi dong duoc:"; docker logs zap; exit 1

      - name: Doi sanh SAST-DAST va quality gate
        id: correlate
        run: |
          python tools/correlate.py \
            --zap http://localhost:8090 \
            --base-url http://localhost:5000 \
            --scan-timeout 300 \
            --fail-on-confirmed

      # ===============================================================
      # BAO CAO - chay ca khi quality gate da that bai, vi luc that bai
      # moi la luc nguoi ta can doc bao cao nhat.
      # ===============================================================
      - name: Dung bao cao HTML
        if: always()
        run: |
          python tools/report.py --title "VulnShop" \
            --sca reports/sca.json \
            --sast reports/semgrep.sarif \
            --routes routes_map.json \
            --dast reports/findings.json \
            --out reports/bao_cao.html || true

      - name: Tom tat len trang ket qua cua lan chay
        if: always()
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          from pathlib import Path

          def j(p):
              q = Path(p)
              return json.loads(q.read_text(encoding="utf-8")) if q.exists() else None

          print("## Ket qua quet bao mat\n")
          print("| Tang | Ket qua |")
          print("|---|---|")
          print(f"| 0. Secret | {os.environ.get('GITLEAKS_COUNT','?')} phat hien |")

          sca = j("reports/sca.json")
          if sca:
              s = sca["summary"]
              print(f"| 1. Thu vien | {s['packages']} goi dinh CVE "
                    f"({s['by_severity']['Critical']} Critical, {s['by_severity']['High']} High) |")

          sar = j("reports/semgrep.sarif")
          if sar:
              n = sum(len(r.get("results", [])) for r in sar.get("runs", []))
              print(f"| 2. Ma nguon | {n} canh bao |")

          rm = j("routes_map.json")
          if rm:
              s = rm.get("summary", {})
              print(f"| 3. Pham vi | {s.get('testable',0)}/{sum(s.values())} endpoint kiem thu dong duoc |")

          f = j("reports/findings.json")
          if f:
              s = f["summary"]
              print(f"| 4. Doi sanh | **CONFIRMED {s.get('CONFIRMED',0)}** · "
                    f"FILTERED {s.get('FILTERED',0)} · UNCONFIRMED {s.get('UNCONFIRMED',0)} |")
              print()
              if s.get("CONFIRMED"):
                  print("> **Cong da chan.** Cac canh bao duoi day da duoc xac nhan la "
                        "khai thac duoc tren ung dung dang chay:\n")
                  for x in f["results"]:
                      if x["label"] == "CONFIRMED":
                          print(f"> - `{x['file']}:{x['line']}` — {x['cwe']} tai `{x.get('url','')}`")
              else:
                  print("> Khong co canh bao nao duoc xac nhan khai thac duoc. "
                        "Luu y: **UNCONFIRMED khong dong nghia voi an toan** — "
                        "do la phan chua co bang chung theo chieu nao.")
          PY

      - name: Day SARIF da gan nhan len Code Scanning
        if: always() && hashFiles('reports/correlated.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/correlated.sarif
          category: doi-sanh-sast-dast

      - name: Day SARIF secret len Code Scanning
        if: always() && hashFiles('reports/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gitleaks.sarif
          category: secret

      - name: Day SARIF cau hinh ha tang len Code Scanning
        if: always() && hashFiles('reports/trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-config.sarif
          category: ha-tang

      - name: Luu bao cao lam artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-bao-mat
          path: reports/

      - name: Gui canh bao Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/notify.py

      - name: Nhat ky ZAP khi co su co
        if: failure()
        run: docker logs zap | tail -50
